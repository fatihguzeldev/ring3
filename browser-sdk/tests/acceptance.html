<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring3 complete backend acceptance</title>
<style>
  body { margin: 20px; color: #18202a; background: #f4f6f8; font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { max-width: 960px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; max-width: 960px; margin-bottom: 12px; }
  button { padding: 8px 12px; cursor: pointer; }
  #runtime-container { width: min(960px, 100%); height: clamp(560px, 70vh, 640px); background: #16191e; border: 1px solid #bac3ce; }
  #state, #status { white-space: pre-wrap; max-width: 960px; overflow-wrap: anywhere; }
  #log { max-width: 960px; height: 180px; overflow: auto; white-space: pre-wrap; padding: 12px; background: white; border: 1px solid #d3dae2; }
</style>
<h1>complete backend SDK acceptance</h1>
<p id="bundle">Loading host configuration…</p>
<nav aria-label="Runtime controls">
  <button id="create">Create session</button>
  <button id="launch">Launch</button>
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
  <button id="status-button">Status</button>
  <button id="stop">Stop</button>
  <button id="dispose">Force dispose</button>
  <button id="assert-closed">Assert closed</button>
</nav>
<p id="state" aria-live="polite">No session.</p>
<p id="status" aria-live="polite">Use ordinary input inside the runtime frame. This host does not synthesize keyboard or mouse events.</p>
<div id="runtime-container" aria-label="Embedded game runtime"></div>
<pre id="log" aria-label="Acceptance event log"></pre>
<script id="acceptance-evidence" type="application/json">{}</script>
<script type="module" src="./acceptance.mjs"></script>
</html>
