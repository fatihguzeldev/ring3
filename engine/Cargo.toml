[package]
name = "ring3-engine"
version = "0.1.0"
edition = "2024"
autotests = false
rust-version = "1.97"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes = { version = "=0.9.3", default-features = false, features = ["hazmat"] }
rustc_apfloat = "=0.2.3"
astro-float-num = { version = "=0.3.7", default-features = false, features = ["std"] }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
wasm-encoder = { version = "=0.259.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[[test]]
name = "abi"
path = "tests/abi/native.rs"

[[test]]
name = "cpu_arithmetic"
path = "tests/cpu/arithmetic/native.rs"

