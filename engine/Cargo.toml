[package]
name = "ring3-engine"
version = "0.1.0"
edition = "2024"
autotests = false
rust-version = "1.97"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes = { version = "=0.9.3", default-features = false, features = ["hazmat"] }
rustc_apfloat = "=0.2.3"
astro-float-num = { version = "=0.3.7", default-features = false, features = ["std"] }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
wasm-encoder = { version = "=0.259.0", default-features = false, features = ["std"] }
unicode-normalization = "=0.1.25"
unicode-general-category = "=1.1.0"
unicode-bidi = "=0.3.18"
icu_collator = "=2.1.1"
icu_normalizer = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
icu_casemap = "=2.1.1"
icu_calendar = "=2.1.1"
icu_datetime = "=2.1.1"
icu_decimal = "=2.1.1"
icu_experimental = { version = "=0.4.0", default-features = false, features = ["compiled_data"] }
icu_provider = "=2.3.1"
writeable = "=0.6.4"
rustfft = "=6.4.1"
fontdue = { version = "=0.9.4", default-features = false, features = ["std"] }
rustybuzz = "=0.20.1"
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
icu_locale = "=2.1.1"
lcid = "=0.3.0"
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
oem_cp = "=2.1.2"

[dev-dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }

[lints.rust]
unsafe_code = "deny"

[[test]]
name = "windows_foundations_wasm"
path = "tests/windows/foundations/wasm.rs"

[lints.clippy]
all = "warn"

[[test]]
name = "abi"
path = "tests/abi/native.rs"

