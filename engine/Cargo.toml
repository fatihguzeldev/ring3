[package]
name = "ring3-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
wasm-encoder = { version = "=0.259.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
