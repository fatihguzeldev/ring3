name: Core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests and doctests
        run: cargo test --workspace --locked
      - name: Native release build
        run: cargo build --workspace --locked --release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Portable tooling tests
        run: node --test tools/corpus/shared.test.mjs tools/corpus/verify.test.mjs tools/core/run-wasm.test.mjs
      - name: Wasm release build and smoke
        run: node tools/core/verify-wasm.mjs
      - name: Browser host build and tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint:web
          pnpm browser:build
          node --test tools/browser/serve.test.mjs tools/browser/bridge.test.mjs
